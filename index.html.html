<!doctype html>
<meta charset="utf-8">
<title>SVWS-OCS-2026 · Mô hình 3D khung thu gom khí</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#0b1622; --bg2:#0e1c2b; --panel:#132436;
  --edge:#22384f; --ink:#dce8f2; --ink2:#8fa6bd; --ink3:#5d7690;
  --amber:#e0a33c; --cyan:#5fd0d8; --red:#e0654a;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --sans:"Inter","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#app{display:flex;height:100%}
#side{width:268px;flex:none;background:var(--panel);border-right:1px solid #1d3348;
  display:flex;flex-direction:column;overflow-y:auto}
#head{padding:14px 15px 12px;border-bottom:1px solid #1d3348}
#head .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink3)}
#head h1{font-size:15px;font-weight:600;margin-top:5px;line-height:1.3}
#head .s{font-family:var(--mono);font-size:10.5px;color:var(--ink2);margin-top:5px}
.grp{padding:12px 15px;border-bottom:1px solid #1d3348}
.grp h2{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink3);
  text-transform:uppercase;margin-bottom:9px}
.row{display:flex;gap:6px;flex-wrap:wrap}
button{font-family:var(--mono);font-size:11px;background:#17293c;color:var(--ink2);
  border:1px solid #24405a;border-radius:3px;padding:5px 9px;cursor:pointer;transition:.12s}
button:hover{background:#1e3450;color:var(--ink)}
button.on{background:#1d4a5c;color:#bff0f4;border-color:#2f7c8c}
button.wide{flex:1;text-align:center}
label.ck{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;
  color:var(--ink2);padding:3.5px 0;cursor:pointer;user-select:none}
label.ck input{accent-color:#3f8fa8;width:13px;height:13px;cursor:pointer}
label.ck .sw{width:11px;height:11px;border-radius:2px;flex:none;border:1px solid #2b4964}
input[type=range]{width:100%;accent-color:#3f8fa8;margin-top:3px}
.val{font-family:var(--mono);font-size:10px;color:var(--ink3);float:right}
#stat{padding:12px 15px;font-family:var(--mono);font-size:10.5px;color:var(--ink2);line-height:1.75}
#stat b{color:var(--ink);font-weight:500}
#stat .r{display:flex;justify-content:space-between;gap:8px}
#view{flex:1;position:relative;background:
  radial-gradient(ellipse at 50% 38%,#12283c 0%,#0a1420 72%)}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.drag{cursor:grabbing}
#hint{position:absolute;left:16px;bottom:14px;font-family:var(--mono);font-size:10.5px;
  color:#4f6b85;line-height:1.7;pointer-events:none}
#tag{position:absolute;right:16px;top:14px;font-family:var(--mono);font-size:10.5px;
  color:#4f6b85;text-align:right;line-height:1.7;pointer-events:none}
#pick{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;font-family:var(--mono);
  font-size:11px;color:var(--cyan);background:#0e2233cc;border:1px solid #235068;
  padding:5px 12px;border-radius:3px;opacity:0;transition:.15s;pointer-events:none}
@media(max-width:820px){#app{flex-direction:column}#side{width:100%;height:auto;max-height:47%}}
</style>

<div id="app">
<div id="side">
  <div id="head">
    <div class="k">SVWS-OCS-2026 · REV. A</div>
    <h1>Khung thu gom khí mùi</h1>
    <div class="s">Mô hình 3D · kích thước mm</div>
  </div>

  <div class="grp">
    <h2>Chọn chụp</h2>
    <div class="row">
      <button class="wide on" data-m="A">CHỤP A · 4×10 m</button>
      <button class="wide" data-m="B">CHỤP B · 2×3 m</button>
    </div>
  </div>

  <div class="grp">
    <h2>Góc nhìn</h2>
    <div class="row">
      <button class="wide" data-v="iso">Trục đo</button>
      <button class="wide" data-v="front">Đứng</button>
      <button class="wide" data-v="side">Cạnh</button>
      <button class="wide" data-v="top">Bằng</button>
    </div>
  </div>

  <div class="grp">
    <h2>Lớp hiển thị</h2>
    <div id="layers"></div>
  </div>

  <div class="grp">
    <h2>Tách rời cấu kiện <span class="val" id="exv">0 mm</span></h2>
    <input type="range" id="exp" min="0" max="1200" value="0" step="10">
    <h2 style="margin-top:12px">Độ trong tấm phủ <span class="val" id="opv">35 %</span></h2>
    <input type="range" id="op" min="0" max="100" value="35">
  </div>

  <div class="grp">
    <h2>Xuất</h2>
    <div class="row">
      <button class="wide" id="png">Lưu ảnh PNG 3×</button>

    </div>
  </div>

  <div id="stat"></div>
</div>

<div id="view">
  <canvas id="cv"></canvas>
  <div id="tag"></div>
  <div id="hint">Kéo trái · xoay &nbsp;|&nbsp; Kéo phải · dời &nbsp;|&nbsp; Lăn chuột · phóng<br>Bấm vào cấu kiện để xem quy cách</div>
  <div id="pick"></div>
</div>
</div>

<script>
"use strict";
/* ============ toán vector ============ */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]);
const nrm=a=>{const l=len(a)||1;return[a[0]/l,a[1]/l,a[2]/l]};

/* ============ định nghĩa lớp ============ */
const LAYERS=[
 {id:"col", n:"Cột",              c:"#b9c6d2", on:1},
 {id:"bem", n:"Dầm biên",         c:"#a6b6c6", on:1},
 {id:"raf", n:"Dầm mái",          c:"#cfd9e3", on:1},
 {id:"pur", n:"Nẹp đỡ tấm",       c:"#8fa2b4", on:1},
 {id:"bra", n:"Giằng chéo",       c:"#7d90a4", on:1},
 {id:"pan", n:"Tấm phủ PC",       c:"#7fd4e8", on:1},
 {id:"acc", n:"Nắp, cửa, cổ hút", c:"#e0a33c", on:1},
 {id:"gut", n:"Máng ngưng",       c:"#c0885c", on:1},
 {id:"tnk", n:"Thành bể",         c:"#43566a", on:1},
 {id:"dim", n:"Kích thước",       c:"#e0a33c", on:1},
 {id:"lbl", n:"Nhãn cấu kiện",    c:"#5fd0d8", on:1},
];
const LON={}; LAYERS.forEach(l=>LON[l.id]=!!l.on);
const LEV={col:0,bem:1,bra:0,raf:2,pur:3,pan:4,acc:5,gut:0,tnk:-1};

/* ============ dựng hình học ============ */
function mkMember(p0,p1,w,h,layer,name,spec){
  const d=sub(p1,p0), L=len(d); if(L<1e-6)return null;
  const dir=mul(d,1/L);
  let up=[0,0,1]; if(Math.abs(dot(dir,up))>0.995) up=[0,1,0];
  const r=nrm(crs(dir,up)), u=nrm(crs(r,dir));
  const hw=w/2, hh=h/2, V=[];
  for(const s of [0,1]){
    const b=s?p1:p0;
    for(const [a,c] of [[-1,-1],[1,-1],[1,1],[-1,1]])
      V.push(add(add(b,mul(r,a*hw)),mul(u,c*hh)));
  }
  const F=[[3,2,1,0],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]];
  return {V,F,layer,name,spec,ctr:mul(add(p0,p1),0.5)};
}
function mkQuad(pts,layer,name,spec){
  return {V:pts,F:[[0,1,2,3]],layer,name,spec,
    ctr:mul(pts.reduce((a,b)=>add(a,b),[0,0,0]),0.25)};
}
function mkTube(c,r,h,seg,layer,name,spec){
  const V=[],F=[];
  for(const s of [0,1]) for(let i=0;i<seg;i++){
    const a=i/seg*Math.PI*2;
    V.push([c[0]+r*Math.cos(a), c[1]+r*Math.sin(a), c[2]+s*h]);
  }
  for(let i=0;i<seg;i++){const j=(i+1)%seg;F.push([i,j,seg+j,seg+i]);}
  F.push([...Array(seg).keys()].map(i=>seg+i));
  return {V,F,layer,name,spec,ctr:[c[0],c[1],c[2]+h/2]};
}

function build(kind){
  const A = kind==="A";
  const LX = A?10200:3200, LY = A?4200:2200;
  const Z0 = A?1340:1180, Z1 = 1000;
  const zt = y => Z0 + (Z1-Z0)*y/LY;
  const colX = A?[0,2040,4080,6120,8160,10200]:[0,1600,3200];
  const rafX = A? Array.from({length:13},(_,i)=>i*850)
                : Array.from({length:5},(_,i)=>i*800);
  const purY = A?[700,1400,2100,2800,3500]:[733,1467];
  const cw = A?50:40, ch = A?50:40;          // cột
  const rw = A?50:40, rh = A?100:80;         // dầm mái
  const M=[], D=[];
  const push=(o)=>{if(o)M.push(o)};

  /* thành bể */
  const T=200, WT=[
    [[-T,-T,-260],[LX+T,-T,-260],[LX+T,0,-260],[-T,0,-260]],
    [[-T,LY,-260],[LX+T,LY,-260],[LX+T,LY+T,-260],[-T,LY+T,-260]],
    [[-T,0,-260],[0,0,-260],[0,LY,-260],[-T,LY,-260]],
    [[LX,0,-260],[LX+T,0,-260],[LX+T,LY,-260],[LX,LY,-260]]];
  WT.forEach((q,i)=>push(mkQuad(q,"tnk","Thành bể BTCT","Rộng 200 mm (giả thiết G3)")));
  [[-T,-T],[LX+T,-T],[-T,LY+T],[LX+T,LY+T]].forEach(()=>{});
  push(mkQuad([[0,0,-260],[LX,0,-260],[LX,LY,-260],[0,LY,-260]],"tnk","Mặt nước","Cao độ −400 so với mặt thành"));

  /* cột */
  const colPos=[];
  colX.forEach(x=>{ colPos.push([x,0]); colPos.push([x,LY]); });
  colPos.push([0,LY/2]); colPos.push([LX,LY/2]);
  colPos.forEach(([x,y])=>{
    const H=zt(y);
    push(mkMember([x,y,0],[x,y,H],cw,ch,"col",
      `Cột ${cw}×${ch}×2,0`, `Cao ${Math.round(H)} mm · SUS304 · chân đế CT-01`));
    push(mkMember([x,y,-25],[x,y,0],150,150,"col","Bản đế 150×150×5","SUS316L · 4 bulong nở M10×100"));
  });

  /* dầm biên cạnh dài */
  [0,LY].forEach(y=>push(mkMember([0,y,zt(y)+25],[LX,y,zt(y)+25],cw,ch,"bem",
    `Dầm biên ${cw}×${ch}×2,0`,`Dài ${LX} mm · nối tại trục cột`)));

  /* dầm mái */
  rafX.forEach(x=>push(mkMember([x,0,zt(0)+100],[x,LY,zt(LY)+100],rw,rh,"raf",
    `Dầm mái ${rw}×${rh}×2,0`,
    `Nhịp ${Math.round(Math.hypot(LY,Z0-Z1))} mm · cắt xiên 2 đầu · @${A?850:800}`)));

  /* nẹp */
  purY.forEach(y=>push(mkMember([0,y,zt(y)+165],[LX,y,zt(y)+165],30,30,"pur",
    "Nẹp đỡ tấm 30×30×1,5",`Trục Y = ${Math.round(y)} mm`)));

  /* giằng chéo */
  const bays = A?[[0,2040],[4080,6120],[8160,10200]]:[[0,1600]];
  const brc=[];
  bays.forEach(([a,b])=>{ brc.push([[a,0,0],[b,0,zt(0)]]); brc.push([[a,LY,0],[b,LY,zt(LY)]]); });
  brc.push([[0,0,0],[0,LY,zt(LY)]]); brc.push([[LX,0,0],[LX,LY,zt(LY)]]);
  brc.forEach(([p,q])=>push(mkMember(p,q,40,4,"bra","Giằng chéo dẹt 40×4",
    "SUS304 · khoan 2 lỗ Ø9 mỗi đầu · CT-10")));

  /* máng ngưng */
  [0,LY].forEach(y=>{const s=y===0?1:-1;
    push(mkMember([0,y+s*80,-30],[LX,y+s*80,-30],100,60,"gut",
      "Máng ngưng U100×60 t=1,0","SUS316L · dốc 1% · CT-04"));});

  /* tấm phủ mái */
  push(mkQuad([[0,0,zt(0)+182],[LX,0,zt(0)+182],[LX,LY,zt(LY)+182],[0,LY,zt(LY)+182]],
    "pan","Tấm mái PC đặc 5 mm",`Diện tích ${(LX*LY/1e6*1.003).toFixed(1)} m² · dốc ${((Z0-Z1)/LY*100).toFixed(1)}%`));
  /* vách bao */
  [0,LY].forEach(y=>push(mkQuad([[0,y,0],[LX,y,0],[LX,y,zt(y)+182],[0,y,zt(y)+182]],
    "pan","Vách bao PC đặc 5 mm",`Cạnh dài · cao ${Math.round(zt(y))} mm`)));
  [0,LX].forEach(x=>push(mkQuad([[x,0,0],[x,LY,0],[x,LY,zt(LY)+182],[x,0,zt(0)+182]],
    "pan","Vách bao PC đặc 5 mm","Cạnh hồi · cắt vát theo dốc mái")));

  /* phụ kiện */
  const noz = A?[[2550,2100],[7650,2100]]:[[1600,1100]];
  const nd  = A?110:90;
  noz.forEach(([x,y])=>{
    push(mkTube([x,y,zt(y)+182],nd/2,300,14,"acc",`Cổ chụp hút D${nd}`,
      `Tọa độ X=${x} Y=${y} · lưới tách bọt · CT-08`));
    push(mkTube([x,y,zt(y)+170],nd/2+55,32,14,"acc","Mặt bích inox","Gioăng EPDM · 4 bulong M8"));
  });
  const mh = A?[[1275,1050],[8925,3150]]:[[600,600]];
  mh.forEach(([x,y])=>push(mkMember([x-300,y,zt(y)+195],[x+300,y,zt(y)+195],600,30,"acc",
    "Nắp thăm 600×600",`Tọa độ X=${x} Y=${y} · gioăng liền vòng · CT-05`)));
  const pv = A?[[4250,1050],[5950,3150]]:[[2550,1650]];
  pv.forEach(([x,y])=>push(mkMember([x-250,y,zt(y)+192],[x+250,y,zt(y)+192],500,24,"acc",
    "Nắp xả áp 500×500",`Tự nâng ở +58 Pa · CT-06`)));
  const iw = A?400:300, ih = A?120:70;
  [0,LX].forEach(x=>push(mkMember([x,LY/2-iw/2,zt(LY/2)-360],[x,LY/2+iw/2,zt(LY/2)-360],
    ih,40,"acc",`Cửa gió bù ${iw}×${ih}`,"Lá chắn mưa 45° + lưới inox · CT-07")));

  /* kích thước */
  const G = A?1 : 0.45;
  const dm=(a,b,t,o)=>D.push({a,b,t,o:o||[0,0,0]});
  dm([0,0,0],[LX,0,0],`${LX.toLocaleString('vi')}  —  trục cột`,[0,-1600*G,-560]);
  dm([LX,0,0],[LX,LY,0],`${LY.toLocaleString('vi')}`,[900*G,0,-420]);
  dm([0,0,0],[0,0,Z0],`${Z0.toLocaleString('vi')}`,[-700*G,-700*G,0]);
  dm([LX,LY,0],[LX,LY,Z1],`${Z1.toLocaleString('vi')}`,[700*G,700*G,0]);
  dm([rafX[0],0,zt(0)+182],[rafX[1],0,zt(0)+182],`${A?850:800}`,[0,-820*G,300]);
  dm([colX[0],0,0],[colX[1],0,0],`${A?2040:1600}`,[0,-850*G,-330]);
  dm([LX,0,zt(0)+182],[LX,purY[0],zt(purY[0])+182],`${Math.round(purY[0])}`,[820*G,0,300]);
  D.push({txt:`ĐỘ DỐC MÁI  i = ${((Z0-Z1)/LY*100).toFixed(1)}%`,
          at:[LX/2,LY/2,zt(LY/2)+1900*G]});
  D.push({txt:`H = ${Z1.toLocaleString('vi')} · KHOANG THU KHÍ`,
          at:[LX/2,LY+1500*G,Z0/2+250]});
  D.push({txt:`±0,00 = MẶT THÀNH BỂ`, at:[-900*G,-2500*G,-750]});

  const info = A? {
    "Lưu lượng hút":"600 m³/h", "Bể":"4.000 × 10.000 mm",
    "Số cột":"14", "Dầm mái":"13 × 50×100×2,0",
    "Nẹp":"5 hàng @700", "Giằng chéo":"8 thanh",
    "Tấm PC":"≈ 76 m²", "Khối lượng inox":"564 kg/chiếc"
  } : {
    "Lưu lượng hút":"180 m³/h", "Bể":"2.000 × 3.000 mm",
    "Số cột":"8", "Dầm mái":"5 × 40×80×2,0",
    "Nẹp":"2 hàng @733", "Giằng chéo":"4 thanh",
    "Tấm PC":"≈ 20 m²", "Khối lượng inox":"125 kg/chiếc"
  };
  return {M,D,info,C:[LX/2,LY/2,Z0/2],R:Math.hypot(LX,LY)/2};
}

/* ============ camera ============ */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let kind="A", S=build("A");
let yaw=-0.66, pit=0.60, zoom=.72, pan=[0,0], dist=0, focal=1400;
let expl=0, opac=.35, DPR=1, W=0, H=0, hover=null;

function fit(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  dist=S.R*3.1;
}
function proj(p){
  let x=p[0]-S.C[0], y=p[1]-S.C[1], z=p[2]-S.C[2];
  const ca=Math.cos(yaw), sa=Math.sin(yaw);
  let x1=x*ca-y*sa, y1=x*sa+y*ca;
  const cb=Math.cos(pit), sb=Math.sin(pit);
  let y2=y1*cb-z*sb, z2=y1*sb+z*cb;
  const d=dist+y2, f=focal/Math.max(d,1)*zoom*(Math.min(W,H)/700);
  return [W/2+x1*f+pan[0], H/2-z2*f+pan[1], d];
}
function shift(o){
  const k=LEV[o.layer]; if(k===undefined||!expl) return [0,0,0];
  return [0,0,k*expl];
}

/* ============ vẽ ============ */
function render(){
  ctx.clearRect(0,0,W,H);
  const faces=[];
  for(const o of S.M){
    if(!LON[o.layer]) continue;
    const off=shift(o);
    const P=o.V.map(v=>proj(add(v,off)));
    for(const f of o.F){
      const pts=f.map(i=>P[i]);
      if(pts.some(p=>p[2]<40)) continue;
      const v3=f.map(i=>add(o.V[i],off));
      const n=nrm(crs(sub(v3[1],v3[0]),sub(v3[2],v3[0])));
      const d=pts.reduce((a,p)=>a+p[2],0)/pts.length;
      faces.push({pts,n,d,o});
    }
  }
  faces.sort((a,b)=>b.d-a.d);
  const L=nrm([-.45,-.72,.75]);
  for(const f of faces){
    const col=LAYERS.find(l=>l.id===f.o.layer).c;
    const sh=.42+.58*Math.max(0,Math.abs(dot(f.n,L)));
    ctx.beginPath();
    ctx.moveTo(f.pts[0][0],f.pts[0][1]);
    for(let i=1;i<f.pts.length;i++) ctx.lineTo(f.pts[i][0],f.pts[i][1]);
    ctx.closePath();
    const gl = f.o===hover;
    if(f.o.layer==="pan"){
      ctx.fillStyle=tint(col,sh); ctx.globalAlpha=opac*(gl?1.6:1);
      ctx.fill(); ctx.globalAlpha=1;
      ctx.strokeStyle="rgba(150,215,235,.5)"; ctx.lineWidth=.8; ctx.stroke();
    }else if(f.o.layer==="tnk"){
      ctx.fillStyle=tint(col,sh*.8); ctx.globalAlpha=.62; ctx.fill(); ctx.globalAlpha=1;
    }else{
      ctx.fillStyle=gl?"#5fd0d8":tint(col,sh); ctx.fill();
      ctx.strokeStyle=gl?"#bff0f4":"rgba(10,20,32,.72)"; ctx.lineWidth=gl?1.4:.7; ctx.stroke();
    }
  }
  if(LON.dim) drawDims();
  if(LON.lbl) drawLabels();
  drawAxis();
}
function tint(hex,k){
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,(n>>16)*k)|0, g=Math.min(255,((n>>8)&255)*k)|0, b=Math.min(255,(n&255)*k)|0;
  return `rgb(${r},${g},${b})`;
}
function drawDims(){
  ctx.font="600 11px var(--mono),monospace";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(const d of S.D){
    if(d.txt){
      const p=proj(d.at); if(p[2]<40) continue;
      ctx.fillStyle="#0b1622cc";
      const w=ctx.measureText(d.txt).width+12;
      ctx.fillRect(p[0]-w/2,p[1]-9,w,18);
      ctx.strokeStyle="#3d5a76"; ctx.lineWidth=.8; ctx.strokeRect(p[0]-w/2,p[1]-9,w,18);
      ctx.fillStyle="#e0a33c"; ctx.fillText(d.txt,p[0],p[1]); continue;
    }
    const a=proj(add(d.a,d.o)), b=proj(add(d.b,d.o));
    const ea=proj(d.a), eb=proj(d.b);
    if(a[2]<40||b[2]<40) continue;
    ctx.strokeStyle="rgba(224,163,60,.34)"; ctx.lineWidth=.8;
    ctx.beginPath(); ctx.moveTo(ea[0],ea[1]); ctx.lineTo(a[0],a[1]);
    ctx.moveTo(eb[0],eb[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    ctx.strokeStyle="#e0a33c"; ctx.lineWidth=1.05;
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
    for(const [p,s] of [[a,1],[b,-1]]){
      ctx.beginPath();
      ctx.moveTo(p[0]+s*7*Math.cos(ang-.42),p[1]+s*7*Math.sin(ang-.42));
      ctx.lineTo(p[0],p[1]);
      ctx.lineTo(p[0]+s*7*Math.cos(ang+.42),p[1]+s*7*Math.sin(ang+.42));
      ctx.stroke();
    }
    const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    const w=ctx.measureText(d.t).width+9;
    ctx.fillStyle="#0b1622e6"; ctx.fillRect(m[0]-w/2,m[1]-8,w,16);
    ctx.fillStyle="#f0c274"; ctx.fillText(d.t,m[0],m[1]);
  }
}
function drawLabels(){
  ctx.font="10.5px var(--mono),monospace"; ctx.textBaseline="middle";
  const seen=new Set(), out=[];
  for(const o of S.M){
    if(!LON[o.layer]||o.layer==="tnk"||seen.has(o.name)) continue;
    seen.add(o.name);
    const p=proj(add(o.ctr,shift(o))); if(p[2]<40) continue;
    out.push({p,t:o.name});
  }
  out.sort((a,b)=>a.p[1]-b.p[1]);
  const used=[];
  for(const q of out){
    let y=q.p[1];
    while(used.some(u=>Math.abs(u-y)<15)) y+=15;
    used.push(y);
    const x=q.p[0]+26;
    ctx.strokeStyle="rgba(95,208,216,.42)"; ctx.lineWidth=.8;
    ctx.beginPath(); ctx.moveTo(q.p[0],q.p[1]); ctx.lineTo(x-4,y); ctx.stroke();
    ctx.fillStyle="#5fd0d8"; ctx.textAlign="left"; ctx.fillText(q.t,x,y);
    ctx.fillStyle="#5fd0d8";
    ctx.beginPath(); ctx.arc(q.p[0],q.p[1],2.1,0,7); ctx.fill();
  }
}
function drawAxis(){
  const o=[26+46,H-100], s=42;
  const ax=[[1,0,0,"X",'#e0654a'],[0,1,0,"Y",'#6fbf6f'],[0,0,1,"Z",'#5fa8e0']];
  const ca=Math.cos(yaw),sa=Math.sin(yaw),cb=Math.cos(pit),sb=Math.sin(pit);
  ctx.font="600 10px var(--mono),monospace"; ctx.textAlign="center"; ctx.textBaseline="middle";
  for(const [x,y,z,n,c] of ax){
    const x1=x*ca-y*sa, y1=x*sa+y*ca;
    const y2=y1*cb-z*sb, z2=y1*sb+z*cb;
    const px=o[0]+x1*s, py=o[1]-z2*s;
    ctx.strokeStyle=c; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(o[0],o[1]); ctx.lineTo(px,py); ctx.stroke();
    ctx.fillStyle=c; ctx.fillText(n,px+(px-o[0])*.16,py+(py-o[1])*.16);
  }
}

/* ============ tương tác ============ */
let drag=null;
cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture(e.pointerId); cv.classList.add("drag");
  drag={x:e.clientX,y:e.clientY,b:e.button,moved:0};
});
cv.addEventListener("pointermove",e=>{
  if(!drag){ pickAt(e); return; }
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  drag.moved+=Math.abs(dx)+Math.abs(dy);
  if(drag.b===2||e.shiftKey){ pan[0]+=dx; pan[1]+=dy; }
  else { yaw+=dx*.0072; pit=Math.max(-0.32,Math.min(1.556,pit-dy*.0072)); }
  drag.x=e.clientX; drag.y=e.clientY; render();
});
cv.addEventListener("pointerup",e=>{
  if(drag&&drag.moved<4) pickAt(e,true);
  drag=null; cv.classList.remove("drag");
});
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("wheel",e=>{
  e.preventDefault(); zoom*=Math.exp(-e.deltaY*.0011);
  zoom=Math.max(.22,Math.min(9,zoom)); render();
},{passive:false});

function pickAt(e,click){
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  let best=null,bd=1e18;
  for(const o of S.M){
    if(!LON[o.layer]||o.layer==="tnk"||o.layer==="pan") continue;
    const off=shift(o), P=o.V.map(v=>proj(add(v,off)));
    for(const f of o.F){
      const pts=f.map(i=>P[i]);
      if(pts.some(p=>p[2]<40)) continue;
      if(inPoly(mx,my,pts)){
        const d=pts.reduce((a,p)=>a+p[2],0)/pts.length;
        if(d<bd){bd=d;best=o;}
      }
    }
  }
  const el=document.getElementById("pick");
  if(best!==hover||click){
    hover=best;
    if(best){ el.textContent=`${best.name}  ·  ${best.spec}`; el.style.opacity=1; }
    else el.style.opacity=0;
    render();
  }
}
function inPoly(x,y,p){
  let c=false;
  for(let i=0,j=p.length-1;i<p.length;j=i++){
    if((p[i][1]>y)!==(p[j][1]>y) &&
       x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0]) c=!c;
  }
  return c;
}

/* ============ giao diện ============ */
const lay=document.getElementById("layers");
LAYERS.forEach(l=>{
  const b=document.createElement("label"); b.className="ck";
  b.innerHTML=`<input type="checkbox" ${l.on?"checked":""}>
    <span class="sw" style="background:${l.c}"></span><span>${l.n}</span>`;
  b.querySelector("input").onchange=ev=>{LON[l.id]=ev.target.checked;render();};
  lay.appendChild(b);
});
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("[data-m]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); kind=b.dataset.m; S=build(kind); hover=null;
  pan=[0,0]; zoom=.72; fit(); stats(); render();
});
const VIEWS={iso:[-0.66,0.60],front:[0,0.02],side:[-1.5708,0.02],top:[0,1.5590]};
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
  [yaw,pit]=VIEWS[b.dataset.v]; render();
});
document.getElementById("exp").oninput=e=>{
  expl=+e.target.value; document.getElementById("exv").textContent=expl+" mm"; render();};
document.getElementById("op").oninput=e=>{
  opac=+e.target.value/100; document.getElementById("opv").textContent=e.target.value+" %"; render();};
document.getElementById("rst").onclick=()=>{
  yaw=-0.66; pit=0.60; zoom=.72; pan=[0,0]; expl=0; opac=.35;
  document.getElementById("exp").value=0; document.getElementById("exv").textContent="0 mm";
  document.getElementById("op").value=35; document.getElementById("opv").textContent="35 %";
  render();};
document.getElementById("png").onclick=()=>{
  const k=3, ow=cv.width, oh=cv.height, oW=W, oH=H, oD=DPR;
  DPR=k*(devicePixelRatio||1); cv.width=oW*DPR; cv.height=oH*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle="#0b1622"; ctx.fillRect(0,0,oW,oH);
  render();
  const a=document.createElement("a");
  a.download=`SVWS-OCS-2026_3D_Chup-${kind}.png`; a.href=cv.toDataURL("image/png"); a.click();
  DPR=oD; cv.width=ow; cv.height=oh; W=oW; H=oH;
  ctx.setTransform(DPR,0,0,DPR,0,0); render();
};
function stats(){
  document.getElementById("stat").innerHTML =
    Object.entries(S.info).map(([k,v])=>`<div class="r"><span>${k}</span><b>${v}</b></div>`).join("");
  document.getElementById("tag").innerHTML =
    `CHỤP ${kind} · ${kind==="A"?"V1, V2":"V3"}<br>Đơn vị: mm · Gốc tọa độ: trục cột góc`;
}
addEventListener("resize",()=>{fit();render();});
fit(); stats(); render();
</script>
